version: "3.8"

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: file-sharing-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - STORAGE_DIR=/data
    volumes:
      - file-sharing-data:/data
    restart: unless-stopped

volumes:
  file-sharing-data:
